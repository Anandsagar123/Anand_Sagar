<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#145A9E" />
      <stop offset="70%" stop-color="#0C447C" />
      <stop offset="100%" stop-color="#052549" />
    </radialGradient>

    <!-- Node Gradient 1 (Teal) -->
    <radialGradient id="tealNode" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#0F6E56" />
      <stop offset="100%" stop-color="#083E31" />
    </radialGradient>

    <!-- Node Gradient 2 (Purple) -->
    <radialGradient id="purpleNode" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="40%" stop-color="#7C4DFF" />
      <stop offset="100%" stop-color="#4C1D95" />
    </radialGradient>

    <!-- Core Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#F1EFE8" stroke-width="2" />
  
  <!-- Outer Orbit Ring -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(241, 239, 232, 0.15)" stroke-width="1.5" stroke-dasharray="6, 4" />
  <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" />

  <!-- Molecular Connections / Lattice Lines -->
  <!-- Staggered lattice connecting bonds -->
  <line x1="100" y1="50" x2="60" y2="90" stroke="rgba(241, 239, 232, 0.4)" stroke-width="1.5" />
  <line x1="100" y1="50" x2="140" y2="90" stroke="rgba(241, 239, 232, 0.4)" stroke-width="1.5" />
  <line x1="60" y1="90" x2="100" y2="150" stroke="rgba(241, 239, 232, 0.4)" stroke-width="1.5" />
  <line x1="140" y1="90" x2="100" y2="150" stroke="rgba(241, 239, 232, 0.4)" stroke-width="1.5" />
  
  <line x1="100" y1="50" x2="100" y2="100" stroke="rgba(52, 211, 153, 0.5)" stroke-width="2" />
  <line x1="60" y1="90" x2="100" y2="100" stroke="rgba(52, 211, 153, 0.5)" stroke-width="2" />
  <line x1="140" y1="90" x2="100" y2="100" stroke="rgba(52, 211, 153, 0.5)" stroke-width="2" />
  <line x1="100" y1="150" x2="100" y2="100" stroke="rgba(52, 211, 153, 0.5)" stroke-width="2" />

  <line x1="60" y1="90" x2="45" y2="130" stroke="rgba(241, 239, 232, 0.25)" stroke-width="1" />
  <line x1="140" y1="90" x2="155" y2="130" stroke="rgba(241, 239, 232, 0.25)" stroke-width="1" />

  <!-- Core Glow Node -->
  <circle cx="100" cy="100" r="14" fill="#fafafa" filter="url(#glow)" opacity="0.3" />
  <circle cx="100" cy="100" r="8" fill="#fafafa" />

  <!-- Orbiting Nodes -->
  <!-- Top Node (Teal) -->
  <circle cx="100" cy="50" r="16" fill="url(#tealNode)" stroke="#F1EFE8" stroke-width="1" />
  <circle cx="95" cy="45" r="4" fill="#fafafa" opacity="0.4" />

  <!-- Bottom Node (Teal) -->
  <circle cx="100" cy="150" r="16" fill="url(#tealNode)" stroke="#F1EFE8" stroke-width="1" />
  <circle cx="95" cy="145" r="4" fill="#fafafa" opacity="0.4" />

  <!-- Left Node (Purple) -->
  <circle cx="60" cy="90" r="12" fill="url(#purpleNode)" stroke="#F1EFE8" stroke-width="1" />
  <circle cx="56" cy="86" r="3" fill="#fafafa" opacity="0.4" />

  <!-- Right Node (Purple) -->
  <circle cx="140" cy="90" r="12" fill="url(#purpleNode)" stroke="#F1EFE8" stroke-width="1" />
  <circle cx="136" cy="86" r="3" fill="#fafafa" opacity="0.4" />

  <!-- Outer Satellite Nodes (Small) -->
  <circle cx="45" cy="130" r="6" fill="#34D399" />
  <circle cx="155" cy="130" r="6" fill="#7C4DFF" />
</svg>
